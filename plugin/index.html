<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Directional Shadow</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <main class="panel">
      <header class="panel-head">
        <h1 class="title">Directional Shadow</h1>
        <span id="badge" class="badge ok">Ready</span>
      </header>

      <div class="stage">
        <canvas id="previewCanvas" width="320" height="252" aria-label="Drag the light to aim the shadow"></canvas>

        <details class="sheet" open>
          <summary>
            <span class="sheet-title">Drop Shadow</span>
          </summary>
          <div class="mini-row">
            <label class="mini">
              <span>A °</span>
              <input id="angle" type="number" min="0" max="360" step="1" value="30" />
            </label>
            <label class="mini">
              <span>D px</span>
              <input id="distance" type="number" min="1" max="300" step="1" value="150" />
            </label>
          </div>
          <div class="mini-row">
            <label class="mini">
              <span>Light %</span>
              <input id="darkness" type="number" min="1" max="100" step="1" value="100" />
            </label>
            <label class="mini">
              <span>Soft %</span>
              <input id="soft" type="number" min="1" max="100" step="1" value="75" />
            </label>
          </div>

          <label class="mini mini-wide">
            <span>Type</span>
            <select id="kind">
              <option value="dropShadow" selected>Drop shadow</option>
              <option value="innerShadow">Inner shadow</option>
            </select>
          </label>
        </details>
      </div>

      <div class="actions">
        <button id="swatchBtn" class="swatch" type="button" title="Shadow colour">
          <span id="swatchDot" class="swatch-dot"></span>
        </button>
        <input id="colour" type="color" value="#000000" hidden />
        <button id="apply" class="button primary" type="button">Apply</button>
      </div>

      <div id="picker" class="picker" hidden>
        <div class="picker-body">
          <canvas id="svCanvas" width="196" height="116" aria-label="Saturation and brightness"></canvas>
          <canvas id="hueCanvas" width="14" height="116" aria-label="Hue"></canvas>
        </div>
        <div class="picker-foot">
          <input id="hexInput" class="input hex" maxlength="7" spellcheck="false" value="#000000" />
          <button id="colourOk" class="button" type="button">OK</button>
          <button id="colourCancel" class="button quiet" type="button">Cancel</button>
        </div>
      </div>
      <div class="actions">
        <button id="removePreview" class="button quiet" type="button" hidden>Remove shadows</button>
      </div>

      <p id="hint" class="hint">
        Drag the light to aim the shadow, then Apply. The last result can be undone with Remove
        shadows.
      </p>

      <footer class="panel-footer">
        <span id="status">idle</span>
        <span id="meta" class="hint"></span>
      </footer>
    </main>

    <script src="colour.js"></script>
    <script src="shadow.js"></script>
    <script src="app.js"></script>
  </body>
</html>
