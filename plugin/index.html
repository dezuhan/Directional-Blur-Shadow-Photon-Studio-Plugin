<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Directional Shadow</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <main class="panel">
      <header class="panel-head">
        <h1 class="title">Directional Shadow</h1>
        <span id="state" class="state">Idle</span>
        <span id="sep" class="sep" aria-hidden="true">·</span>
        <span id="badge" class="badge ok">Ready</span>
      </header>

      <div class="stage">
        <canvas id="previewCanvas" width="320" height="320" aria-label="Drag the light to aim the shadow"></canvas>


      </div>

            <div class="values">
        <div class="mini">
          <span>Type</span>
          <span class="select">
            <select id="kind" aria-label="Shadow type">
              <option value="dropShadow" selected>Drop shadow</option>
              <option value="innerShadow">Inner shadow</option>
            </select>
            <span class="chevron" aria-hidden="true"></span>
          </span>
        </div>
        <div class="mini">
          <span>Blend</span>
          <span class="select">
            <select id="blend" aria-label="Shadow blend mode">
                <option value="normal" selected>Normal</option>
                <option value="dissolve">Dissolve</option>
                <option value="darken">Darken</option>
                <option value="multiply">Multiply</option>
                <option value="color-burn">Color Burn</option>
                <option value="linear-burn">Linear Burn</option>
                <option value="darker-color">Darker Color</option>
                <option value="lighten">Lighten</option>
                <option value="screen">Screen</option>
                <option value="color-dodge">Color Dodge</option>
                <option value="linear-dodge">Linear Dodge</option>
                <option value="lighter-color">Lighter Color</option>
                <option value="overlay">Overlay</option>
                <option value="soft-light">Soft Light</option>
                <option value="hard-light">Hard Light</option>
                <option value="vivid-light">Vivid Light</option>
                <option value="linear-light">Linear Light</option>
                <option value="pin-light">Pin Light</option>
                <option value="hard-mix">Hard Mix</option>
                <option value="difference">Difference</option>
                <option value="exclusion">Exclusion</option>
                <option value="subtract">Subtract</option>
                <option value="divide">Divide</option>
                <option value="hue">Hue</option>
                <option value="saturation">Saturation</option>
                <option value="color">Color</option>
                <option value="luminosity">Luminosity</option>
            </select>
            <span class="chevron" aria-hidden="true"></span>
          </span>
        </div>

        <div class="shadow-grid">
          <label class="mini">
            <span>Angle</span>
            <input id="angle" type="number" min="0" max="360" step="1" value="30" />
          </label>
          <label class="mini">
            <span>Distance</span>
            <input id="distance" type="number" min="1" max="300" step="1" value="150" />
          </label>
          <label class="mini">
            <span>Light %</span>
            <input id="darkness" type="number" min="1" max="100" step="1" value="100" />
          </label>
          <label class="mini">
            <span>Soft %</span>
            <input id="soft" type="number" min="1" max="100" step="1" value="75" />
          </label>
        </div>

      </div>



      <div class="actions">
        <button id="cardSwatchBtn" class="swatch square" type="button" title="Preview box colour">
          <span id="cardSwatchDot" class="swatch-dot"></span>
        </button>
        <button id="swatchBtn" class="swatch" type="button" title="Shadow colour">
          <span id="swatchDot" class="swatch-dot"></span>
        </button>
        <input id="colour" type="color" value="#000000" hidden />
        <button id="apply" class="button primary" type="button">Apply</button>
      </div>

      <div id="picker" class="picker" hidden>
        <span id="pickerTitle" class="picker-title">Shadow colour</span>
        <div class="picker-body">
          <canvas id="svCanvas" width="196" height="116" aria-label="Saturation and brightness"></canvas>
          <canvas id="hueCanvas" width="14" height="116" aria-label="Hue"></canvas>
        </div>
        <div class="picker-foot">
          <input id="hexInput" class="input hex" maxlength="7" spellcheck="false" value="#000000" />
          <button id="colourOk" class="button" type="button">OK</button>
          <button id="colourCancel" class="button quiet" type="button">Cancel</button>
        </div>
      </div>
      <div class="actions">
        <button id="removePreview" class="button quiet" type="button" hidden>Remove shadows</button>
      </div>

      <p id="hint" class="hint">
        Drag the light to aim the shadow, then Apply. The last result can be undone with Remove
        shadows.
      </p>

      <footer class="panel-footer">
        <span id="version">v0.18.0</span>
        <div class="footer-actions">
          <button id="detailsBtn" class="link-button" type="button">Details</button>
          <button id="serviceBtn" class="link-button" type="button">Check service</button>
        </div>
        <span id="status" hidden></span>
        <span id="meta" hidden></span>
      </footer>

      <div class="overlay" id="detailsOverlay" hidden>
        <div class="overlay-card" role="dialog" aria-label="Plugin details and logs">
          <header class="overlay-head">
            <span class="overlay-title">Details</span>
            <button id="detailsClose" class="link-button" type="button">Close</button>
          </header>
          <pre id="detailsLog" class="overlay-log log"></pre>
        </div>
      </div>
    </main>

    <script src="select.js"></script>
    <script src="colour.js"></script>
    <script src="shadow.js"></script>
    <script src="app.js"></script>
  </body>
</html>
